name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install AOT dependencies
        run: brew install openssl@3 brotli

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i '' -E "s/[0-9]+(\.[0-9]+){2}(-[^\"]+)?/${VERSION}/" src/String/Version.cs

      - name: Publish native AOT
        run: just publish-rid osx-arm64

      - name: Create tarball
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          TARBALL="string-${VERSION}-osx-arm64.tar.gz"
          tar -czf "$TARBALL" -C out string
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "SHA256=$(shasum -a 256 "$TARBALL" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.TARBALL }}
